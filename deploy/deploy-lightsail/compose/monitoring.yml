# VM sidecar: Prometheus + Grafana + Alertmanager (localhost only).
#
# Prerequisite: ZettaBridge API on host :8080 (127.0.0.1 bind from oci.staging.yml).
#
# From repo (dev):
#   cp deploy/env/monitoring.env.example deploy/env/monitoring.env
#   ./deploy/scripts/monitoring-up.sh
#
# On Lightsail VM:
#   cp /opt/zettabridge/env/monitoring.env.example /opt/zettabridge/env/monitoring.env
#   /opt/zettabridge/scripts/monitoring-up.sh

name: zettabridge-monitoring

services:
  prometheus:
    image: prom/prometheus:v2.52.0
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${MONITORING_RENDER_DIR:?set MONITORING_RENDER_DIR}/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=2GB
      - --web.enable-lifecycle
    networks:
      - monitoring

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    volumes:
      - ${MONITORING_RENDER_DIR}/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:11.0.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_HTTP_ADDR: "0.0.0.0"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: "1s"
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:
