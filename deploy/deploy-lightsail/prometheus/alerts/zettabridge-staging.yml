# Staging alert thresholds — looser to reduce noise from smoke / functional tests.
# Alerts inherit external_labels.environment=staging from Prometheus.

groups:
  - name: zettabridge_staging
    interval: 30s
    rules:
      - alert: ZettaBridgeDown
        expr: up{job="zettabridge"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: ZettaBridge metrics scrape is down
          description: Prometheus cannot scrape {{ $labels.job }} ({{ $labels.instance }}).

      - alert: IngestRejectSpike
        expr: |
          (
            sum(rate(zettabridge_ingest_total{status="rejected"}[5m]))
            /
            clamp_min(sum(rate(zettabridge_ingest_total[5m])), 0.001)
          ) > 0.5
          and sum(rate(zettabridge_ingest_total[5m])) > 0.05
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: High ingest rejection rate
          description: More than 50% of ingests rejected over 15m on staging.

      - alert: TradeAuthFailedSpike
        expr: sum(rate(zettabridge_trades_total{status="rejected",error_code="auth_failed"}[5m])) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Broker auth failures elevated
          description: auth_failed trades exceeding 0.5/s — check credential tokens.

      - alert: TradeRateLimited
        expr: sum(rate(zettabridge_trades_total{status="rejected",error_code="rate_limited"}[5m])) > 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Plan rate limits firing often
          description: rate_limited trades > 1/s for 15m — load test or plan limits.

      - alert: BrokerHTTPLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(zettabridge_broker_http_duration_seconds_bucket[5m]))
          ) > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Broker HTTP p95 latency high
          description: Outbound broker p95 latency above 10s for 10m.

      - alert: DedupStorm
        expr: |
          sum(rate(zettabridge_dedup_hits_total[5m]))
          >
          5 * clamp_min(sum(rate(zettabridge_ingest_total{status="queued"}[5m])), 0.001)
        for: 15m
        labels:
          severity: info
        annotations:
          summary: Dedup suppressions elevated
          description: TradingView retries or duplicate signals — informational on staging.
